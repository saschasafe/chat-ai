services:
  backend:
    build: ./back
    container_name: chat-ai-backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ~/secrets/back.json:/run/secrets/back
    environment:
      - NODE_ENV=production

  frontend:
    build: ./front
    container_name: chat-ai-frontend
    restart: unless-stopped
    ports:
      - "80:8080"
    volumes:
      - ~/secrets/front.json:/run/secrets/front
    depends_on:
      - backend